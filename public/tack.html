<style>

<body class="bg-[#090e19] text-white antialiased min-h-screen flex flex-col">

  </div>

<footer class="border-t border-white/10 py-9"><div class="max-w-7xl mx-auto px-6 flex flex-wrap gap-4 justify-between text-sm text-gray-400"><span class="font-bold text-white">Schysst Rankning</span><span>© 2026 Schysst Rankning</span></div></footer>
